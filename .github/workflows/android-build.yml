# Android-only build workflow.
#
# Mirrors the Android jobs of flutter-build.yml but drops every other platform.
# Trigger it manually from the Actions tab (or add a tag trigger if needed).
#
# Signing: configure these repository secrets to get a release-signed APK:
#   ANDROID_SIGNING_KEY         base64 of the .jks keystore
#   ANDROID_ALIAS               key alias (e.g. aliudesk)
#   ANDROID_KEY_STORE_PASSWORD  keystore password
#   ANDROID_KEY_PASSWORD        key password
# Without them the build falls back to the debug signing key.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      universal:
        description: "额外构建通用 APK（arm64 + armv7 + x86_64 合并）"
        type: boolean
        default: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  FLUTTER_VERSION: "3.24.5"        # must match flutter/android/app/build.gradle requirements
  BRIDGE_FLUTTER_VERSION: "3.22.3" # bridge is generated with 3.22.3, same as upstream
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    name: Generate flutter-rust bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: aliudesk-android-bridge

      - name: Cache bridge tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: aliudesk-bridge-tools-${{ env.CARGO_EXPAND_VERSION }}-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install bridge tooling and dependencies
        run: |
          command -v cargo-expand >/dev/null || \
            cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          command -v flutter_rust_bridge_codegen >/dev/null || \
            cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # extended_text 14 needs a newer Dart; downgrade so pub resolves with Flutter 3.22.3
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter_rust_bridge codegen
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
          if-no-files-found: error

  build-android:
    name: Android ${{ matrix.job.abi }}
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HAS_ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-linux-android,
              abi: arm64-v8a,
              platform: android-arm64,
              ndk-script: ndk_arm64.sh,
              libcxx-triple: aarch64-linux-android,
            }
          - {
              arch: armv7,
              target: armv7-linux-androideabi,
              abi: armeabi-v7a,
              platform: android-arm,
              ndk-script: ndk_arm.sh,
              libcxx-triple: arm-linux-androideabi,
            }
          - {
              arch: x86_64,
              target: x86_64-linux-android,
              abi: x86_64,
              platform: android-x64,
              ndk-script: ndk_x64.sh,
              libcxx-triple: x86_64-linux-android,
            }
    steps:
      - name: Free disk space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc-multilib \
            git \
            g++ \
            g++-multilib \
            libc6-dev \
            libclang-dev \
            libunwind-dev \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            tree \
            wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./flutter/build_android_deps.sh ${{ matrix.job.abi }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: aliudesk-android
          key: ${{ matrix.job.target }}

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: aliudesk-cargo-ndk-${{ env.CARGO_NDK_VERSION }}

      - name: Build librustdesk.so
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          command -v cargo-ndk >/dev/null || \
            cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.ndk-script }}
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/librustdesk.so

      - name: Upload librustdesk.so
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librustdesk.so.${{ matrix.job.target }}
          path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so

      - name: Configure release signing
        if: env.HAS_ANDROID_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > flutter/android/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > flutter/android/key.properties

      - name: Fall back to debug signing
        if: env.HAS_ANDROID_SIGNING_KEY != 'true'
        run: |
          echo "::warning::ANDROID_SIGNING_KEY is not configured, the APK will be debug-signed."
          sed -i 's/signingConfigs.release/signingConfigs.debug/g' flutter/android/app/build.gradle

      - name: Resolve app version
        run: |
          echo "APP_VERSION=$(grep '^version:' flutter/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' ./flutter/android/gradle.properties
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.libcxx-triple }}/libc++_shared.so" \
             ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/
          pushd flutter
          flutter build apk --release --target-platform ${{ matrix.job.platform }} --split-per-abi
          popd
          mkdir -p out
          cp "./flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.abi }}-release.apk" \
             "out/aliudesk-${APP_VERSION}-${{ matrix.job.arch }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aliudesk-${{ env.APP_VERSION }}-${{ matrix.job.arch }}.apk
          path: out/aliudesk-*.apk
          if-no-files-found: error

  build-universal:
    name: Android universal APK
    needs: [build-android]
    if: ${{ inputs.universal }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HAS_ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY != '' }}
    steps:
      - name: Free disk space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            git \
            openjdk-17-jdk-headless \
            wget

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Download librustdesk.so artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: librustdesk.so.*
          path: ./jni-src

      - name: Stage native libraries
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          stage() {
            local triple="$1" abi="$2" libcxx_triple="$3"
            mkdir -p "./flutter/android/app/src/main/jniLibs/${abi}"
            cp "./jni-src/librustdesk.so.${triple}/liblibrustdesk.so" \
               "./flutter/android/app/src/main/jniLibs/${abi}/librustdesk.so"
            cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${libcxx_triple}/libc++_shared.so" \
               "./flutter/android/app/src/main/jniLibs/${abi}/"
          }
          stage aarch64-linux-android arm64-v8a aarch64-linux-android
          stage armv7-linux-androideabi armeabi-v7a arm-linux-androideabi
          stage x86_64-linux-android x86_64 x86_64-linux-android

      - name: Configure release signing
        if: env.HAS_ANDROID_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > flutter/android/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > flutter/android/key.properties

      - name: Fall back to debug signing
        if: env.HAS_ANDROID_SIGNING_KEY != 'true'
        run: |
          echo "::warning::ANDROID_SIGNING_KEY is not configured, the APK will be debug-signed."
          sed -i 's/signingConfigs.release/signingConfigs.debug/g' flutter/android/app/build.gradle

      - name: Resolve app version
        run: |
          echo "APP_VERSION=$(grep '^version:' flutter/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)" >> "$GITHUB_ENV"

      - name: Build universal APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' ./flutter/android/gradle.properties
          pushd flutter
          flutter build apk --release --target-platform android-arm64,android-arm,android-x64
          popd
          mkdir -p out
          cp ./flutter/build/app/outputs/flutter-apk/app-release.apk \
             "out/aliudesk-${APP_VERSION}-universal.apk"

      - name: Upload universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aliudesk-${{ env.APP_VERSION }}-universal.apk
          path: out/aliudesk-*-universal.apk
          if-no-files-found: error
